<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>روابط</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<script>
/* =====================================================================
   ✏️ عدّل هنا بس — كل عميل له نسخة من هذا الملف
   ===================================================================== */
const CONFIG = {
  name: 'ضراع',
  bio: 'استوديو تصميم وبرمجة — شعارات، هويات، مواقع ومتاجر.',
  // رابط الشعار (صورة مربعة). اتركه فاضي ('') ويطلع أول حرف من الاسم بداله
  logo: '',

  // الألوان: background خلفية الصفحة، text النصوص، button لون الأزرار، buttonText نص الأزرار
  colors: { background: '#f5f4f0', text: '#1e1e1e', button: '#1e1e1e', buttonText: '#f5f4f0' },
  // ألوان الوضع الليلي (تشتغل تلقائياً إذا جوال الزائر على الوضع الليلي). حط null عشان تقفّلها
  darkColors: { background: '#1a1a1a', text: '#f2f1ed', button: '#f2f1ed', buttonText: '#1a1a1a' },

  // الأزرار الكبيرة — icon واحد من: store, whatsapp, instagram, tiktok, x, snapchat, youtube, map, email, phone, link
  links: [
    { label: 'تسوّق من متجرنا', url: 'https://dera.life', icon: 'store' },
    { label: 'اطلب عبر الواتساب', url: 'https://wa.me/966559750395', icon: 'whatsapp' },
    { label: 'أعمالنا على انستقرام', url: 'https://www.instagram.com/brad_stoer?cplk=MWl3cjRuNzY1Mm9sdw%3D%3D&utm_source=qr', icon: 'instagram' },
  ],

  // أيقونات صغيرة تحت الأزرار (اختياري) — احذف أي سطر ما تحتاجه
  socials: [
    { url: 'https://tiktok.com/@t5.y01', icon: 'tiktok', label: 'تيك توك' },
    { url: 'https://x.com/dra_stor?s=11', icon: 'x', label: 'إكس' },
    { url: '', icon: 'snapchat', label: 'سناب شات' },
  ],

  // سطر أسفل الصفحة (اختياري) — مثلاً حقوق التصميم لمتجرك
  footer: { text: 'تصميم ضراع', url: 'https://dera.life' },
};
</script>
<style>
  :root {
    --bg: #f5f4f0; --fg: #1e1e1e; --btn: #1e1e1e; --btn-fg: #f5f4f0;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 30rem; margin: 0 auto; padding: 3.5rem 1.25rem 2.5rem; text-align: center; }
  .avatar {
    width: 6.5rem; height: 6.5rem; margin: 0 auto 1.1rem; border-radius: 50%;
    display: grid; place-items: center; overflow: hidden;
    background: var(--btn); color: var(--btn-fg); font-size: 2.6rem; font-weight: 700;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  h1 { font-size: 1.6rem; font-weight: 700; line-height: 1.3; }
  .bio { margin: .5rem auto 0; max-width: 24rem; font-size: 1rem; line-height: 1.7; opacity: .75; }
  .links { list-style: none; padding: 0; margin-top: 2rem; display: grid; gap: .8rem; }
  .links a {
    position: relative; display: flex; align-items: center; justify-content: center;
    min-height: 3.6rem; padding: .8rem 3.4rem; border-radius: 1rem;
    background: var(--btn); color: var(--btn-fg); text-decoration: none;
    font-size: 1.05rem; font-weight: 600; line-height: 1.4;
    transition: transform .15s ease;
  }
  .links a:active { transform: scale(.98); }
  .links svg { position: absolute; right: 1.1rem; top: 50%; transform: translateY(-50%); width: 1.5rem; height: 1.5rem; }
  .socials { display: flex; justify-content: center; flex-wrap: wrap; gap: .6rem; margin-top: 1.8rem; list-style: none; padding: 0; }
  .socials a {
    display: grid; place-items: center; width: 3rem; height: 3rem; border-radius: 50%;
    color: var(--fg); border: 2px solid currentColor; opacity: .85;
  }
  .socials svg { width: 1.4rem; height: 1.4rem; }
  a:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  footer { margin-top: 2.8rem; font-size: .85rem; opacity: .55; }
  footer a { color: inherit; }
  @media (prefers-reduced-motion: reduce) { .links a { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="avatar" id="avatar"></div>
  <h1 id="name"></h1>
  <p class="bio" id="bio"></p>
  <ul class="links" id="links"></ul>
  <ul class="socials" id="socials"></ul>
  <footer id="footer"></footer>
</main>
<script>
(() => {
  const s = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  const ICONS = {
    store: `<path ${s} d="M5 8h14l-1.2 12H6.2L5 8Z"/><path ${s} d="M9 8V6a3 3 0 0 1 6 0v2"/>`,
    whatsapp: `<path ${s} d="M4 20l1.3-4A8 8 0 1 1 8.4 19L4 20Z"/><path ${s} d="M9.5 9.5c.3 2 2 3.8 4 4.5l1-1.2 1.8.8-.4 1.6c-3.2 0-6.3-3-6.6-6.2l1.6-.5.8 1.8-1.2 1"/>`,
    instagram: `<rect x="4" y="4" width="16" height="16" rx="5" ${s}/><circle cx="12" cy="12" r="3.6" ${s}/><circle cx="17" cy="7" r="1" fill="currentColor"/>`,
    tiktok: `<path ${s} d="M14 4v10.5a3.5 3.5 0 1 1-3.5-3.5"/><path ${s} d="M14 4c.4 2.6 2.2 4.2 5 4.4"/>`,
    x: `<path ${s} d="M5 4l14 16M19 4L5 20"/>`,
    snapchat: `<path ${s} d="M12 4c3 0 5 2.2 5 5v2.5l2 .8-1.6 1.4c.5 1.4 1.6 2.3 2.6 2.6-1 .9-2.2 1-3 1.1L16.5 19 12 20l-4.5-1-.5-1.6c-.8-.1-2-.2-3-1.1 1-.3 2.1-1.2 2.6-2.6L5 12.3l2-.8V9c0-2.8 2-5 5-5Z"/>`,
    youtube: `<rect x="3" y="6" width="18" height="12" rx="4" ${s}/><path d="M10.5 9.5v5l4-2.5-4-2.5Z" fill="currentColor"/>`,
    map: `<path ${s} d="M12 21s-6-5.4-6-10.5a6 6 0 0 1 12 0C18 15.6 12 21 12 21Z"/><circle cx="12" cy="10.5" r="2.2" ${s}/>`,
    email: `<rect x="3.5" y="5.5" width="17" height="13" rx="2.5" ${s}/><path ${s} d="M4 7l8 6 8-6"/>`,
    phone: `<path ${s} d="M6.5 4h3l1.5 4-2 1.5a10 10 0 0 0 5.5 5.5l1.5-2 4 1.5v3a2 2 0 0 1-2 2A15 15 0 0 1 4.5 6a2 2 0 0 1 2-2Z"/>`,
    link: `<path ${s} d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path ${s} d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>`,
  };
  const icon = (n) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ICONS.link}</svg>`;
  const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = (u) => (/^(https?:|mailto:|tel:)/i.test(String(u).trim()) ? String(u).trim() : '#');
  const ext = (u) => /^https?:/i.test(u) ? ' target="_blank" rel="noopener"' : '';
  const C = CONFIG;

  const root = document.documentElement.style;
  const apply = (c) => {
    root.setProperty('--bg', c.background); root.setProperty('--fg', c.text);
    root.setProperty('--btn', c.button); root.setProperty('--btn-fg', c.buttonText);
  };
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const theme = () => {
    const dark = C.darkColors && mq.matches;
    apply(dark ? C.darkColors : C.colors);
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
  };
  theme();
  mq.addEventListener('change', theme);

  document.title = C.name;
  document.querySelector('meta[name="description"]').content = C.bio || '';
  const av = document.getElementById('avatar');
  av.innerHTML = C.logo ? `<img src="${esc(C.logo)}" alt="${esc(C.name)}">` : esc([...C.name.trim()][0] || '');
  document.getElementById('name').textContent = C.name;
  document.getElementById('bio').textContent = C.bio || '';

  document.getElementById('links').innerHTML = (C.links || []).map((l) => {
    const u = safeUrl(l.url);
    return `<li><a href="${esc(u)}"${ext(u)}>${icon(l.icon)}${esc(l.label)}</a></li>`;
  }).join('');

  const soc = document.getElementById('socials');
  soc.innerHTML = (C.socials || []).map((l) => {
    const u = safeUrl(l.url);
    return `<li><a href="${esc(u)}"${ext(u)} aria-label="${esc(l.label || l.icon)}">${icon(l.icon)}</a></li>`;
  }).join('');
  if (!soc.children.length) soc.remove();

  const f = document.getElementById('footer');
  if (C.footer && C.footer.text) {
    f.innerHTML = C.footer.url ? `<a href="${esc(safeUrl(C.footer.url))}" target="_blank" rel="noopener">${esc(C.footer.text)}</a>` : esc(C.footer.text);
  } else f.remove();
})();
</script>
</body>
</html>
